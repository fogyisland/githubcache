<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: rounded square in light theme tone -->
  <rect width="64" height="64" rx="12" ry="12" fill="#FAFAF7"/>
  <!-- Three stacked horizontal bars representing cache layers -->
  <rect x="14" y="18" width="36" height="6" rx="3" fill="#0D1117"/>
  <rect x="14" y="30" width="36" height="6" rx="3" fill="#0D1117"/>
  <rect x="14" y="42" width="36" height="6" rx="3" fill="#0D1117"/>
